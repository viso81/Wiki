name: Notify Quartz to rebuild

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger quartz rebuild
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.QUARTZ_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/viso81/quartz/dispatches \
            -d '{"event_type":"wiki-updated"}'
